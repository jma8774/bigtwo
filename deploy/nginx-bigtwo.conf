# /etc/nginx/sites-available/bigtwo
# Symlink into /etc/nginx/sites-enabled/ then `nginx -t && systemctl reload nginx`.
# TLS certs are produced by `certbot --nginx -d bigtwo.cutecalico.com`.

server {
    listen 80;
    listen [::]:80;
    server_name bigtwo.cutecalico.com;

    # Certbot writes ACME challenges here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bigtwo.cutecalico.com;

    # Filled in by certbot --nginx.
    ssl_certificate     /etc/letsencrypt/live/bigtwo.cutecalico.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigtwo.cutecalico.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/bigtwo-public;
    index index.html;

    # WebSocket + long-polling fallback for Socket.IO.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived ws connections; keep generous timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health endpoint — bypass the SPA fallback so deploy.sh can poll it.
    location = /healthz {
        proxy_pass http://127.0.0.1:3002/healthz;
        proxy_set_header Host $host;
    }

    # Cache hashed Vite assets aggressively. index.html stays uncached so
    # deploys flip the version pointer immediately.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
